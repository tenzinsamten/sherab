# Feature 1: Accounts & Roles (CAP-1)
- id: "1-1"
  title: Teacher & student account management
  description: >-
    Admin creates/verifies teacher accounts and assigns them to classes
    (many-to-many); students self-register with consent, land Pending,
    and are approved by their class teacher(s) or the admin as backup.
    See SPEC.md CAP-1 and roles-and-permissions.md.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Neither the tech stack/architecture nor the UI/UX design has been
    decided yet — this is the first story, so it is also where the stack
    gets chosen. Propose and document an architecture appropriate to the
    SPEC.md constraints (low/near-free-cost PWA, no app-store install,
    German/English/Tibetan UI, simple enough for non-technical volunteer
    teachers) before writing feature code, rather than assuming one.
    Do not invent visual design beyond bare-functional screens; flag
    anywhere a real UX decision is needed instead of guessing.

- id: "1-2"
  title: Student self-registration & approval
  description: >-
    Student self-registers with name + class code + guardian consent and
    lands Pending; their assigned class teacher(s), or the admin as
    backup, approve or reject, with an inline team-picker that sets
    `team_id` at approval time. Students sign in via username + short PIN
    (mechanism decided, not built, in Story 1-1). See SPEC.md CAP-1 and
    roles-and-permissions.md.
  spec_checkpoint: false
  done_checkpoint: true
  invoke_dev_with: >-
    Split out of Story 1-1 to keep that spec under its token budget, not
    because it's independent: classes/codes and admin/teacher accounts
    already exist (Story 1-1's schema/RLS pattern — is_admin()/
    is_teacher_of_class() — should extend to students, not be
    reinvented). The team-picker at approval references Story 4-3's team
    concept, which does not exist yet either; investigate whether a
    minimal `teams` table (name only) needs to be scoped into this story
    as prerequisite schema (mirroring how Story 1-1 itself had to
    scaffold `classes` from nothing) or whether approval can proceed
    without a team assignment for now — flag as an Open Question rather
    than assuming either way. This story's completion is also what
    unblocks Story 2-1 (roster & skill tracking), which needs students to
    exist and currently cannot proceed without this.

# Feature 2: Roster & Skill Tracking (CAP-2)
- id: "2-1"
  title: Roster & skill-status tracking
  description: >-
    Any teacher assigned to a class can mark weekly attendance and set
    per-student per-skill-area status (language/song/dance), with full
    history and optional notes. Class-scoped visibility. See SPEC.md CAP-2.
  spec_checkpoint: false
  done_checkpoint: true
  invoke_dev_with: >-
    Build on the architecture chosen in Story 1-1. Status changes must be
    append-to-history, never overwrite-in-place, so a substitute teacher
    can see the full timeline.

# Feature 3: Homework (CAP-3)
- id: "3-1"
  title: One-off homework assignment & review
  description: >-
    Teacher creates/assigns homework (title, skill area, targets, due
    date, optional reference links); student self-marks Done; teacher
    marks Reviewed; overdue items stay visible until archived. See
    SPEC.md CAP-3 and homework-workflow.md.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    UI/UX for this flow is not designed yet — keep the first pass
    functional (list, mark-done toggle, review toggle) rather than
    polished, and flag where a real design pass would change the
    interaction. Model the Assigned/Done/Reviewed states explicitly;
    Done alone must be independently readable from Reviewed (Story 4-1
    needs Done, skill-history needs Reviewed).

- id: "3-2"
  title: Recurring homework assignments
  description: >-
    Teacher sets a homework item to recur on a cadence (weekly by
    default); each period auto-generates an independent instance with
    its own Done/Reviewed status. See SPEC.md CAP-3 and
    homework-workflow.md.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Extends Story 3-1's data model — do not special-case recurring
    instances in a way that breaks Story 3-1's streak/review reads.
    Editing or ending a series must never touch past instances.

# Feature 4: Gamification (CAP-4, CAP-5, CAP-6)
- id: "4-1"
  title: Streaks
  description: >-
    Per-student streak of consecutive weeks with both attendance and
    homework Done, surviving an admin-configurable grace period
    (default 2 missed weeks). See SPEC.md CAP-4 and gamification.md.
  spec_checkpoint: true
  done_checkpoint: false
  invoke_dev_with: >-
    The grace-period value must be a stored, admin-editable setting from
    day one, not a hardcoded constant — retrofitting configurability
    later means a migration. No UI/UX design yet for how the streak is
    displayed to students; a plain number/indicator is enough for now.

- id: "4-2"
  title: Badges
  description: >-
    Student earns badges at configurable milestone increments of
    attendance count and homework-done count; visible only on their own
    profile. See SPEC.md CAP-5 and gamification.md.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Milestone step size is an open question in SPEC.md (5 vs. 10) —
    make it a configurable value, not a hardcoded one, so the answer
    can land later without a code change. No badge visual design exists
    yet; placeholder icons/labels are fine for this story.

- id: "4-3"
  title: Team leaderboard
  description: >-
    Students belong to a fixed-for-the-year team, manually assigned by
    their teacher at approval time (including mid-year joins); teams
    are ranked by combined streak, visible only within the school. See
    SPEC.md CAP-6 and gamification.md.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Requires a deliberate seam back into Story 1-1's approval flow (team
    picker at the moment a teacher approves a student) — do not bolt
    this on as a disconnected admin screen. No leaderboard visual design
    yet; a simple ranked list is sufficient for this story.

# Feature 5: Admin Oversight & Privacy (CAP-7, CAP-8)
- id: "5-1"
  title: Admin cross-class oversight & data deletion
  description: >-
    Admin gets an aggregate cross-class dashboard (all teachers,
    students, completion) and reviews/approves student data-deletion
    requests before any erasure. See SPEC.md CAP-7 and CAP-8, and
    roles-and-permissions.md.
  spec_checkpoint: false
  done_checkpoint: true
  invoke_dev_with: >-
    The admin backup-approve capability shares its mechanism with Story
    1-1's teacher-approval flow — reuse it rather than building a
    parallel path. Deletion must never be a single click: require an
    explicit admin confirmation step and leave an audit trail of the
    approval.

# Feature 6: Calendar (CAP-9, CAP-10, CAP-11)
- id: "6-1"
  title: Class days & sessions
  description: >-
    Admin marks school-wide class days (several classes per day); each
    class gets a session per class day from its default start time and
    duration, which any class teacher can override or cancel per day.
    See SPEC.md CAP-9, CAP-10 and calendar.md.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Brownfield: SvelteKit + Supabase with append-only tables and
    class-scoped RLS via is_admin()/is_teacher_of_class() — extend those,
    do not reinvent. A per-day override must never rewrite the class
    default or other days. Store times as Munich local (Europe/Berlin).
    Add a calendar view reachable from the admin, teacher and student
    menus (student menu from #46: Dashboard, My classes, My homework, Team
    leaderboard). Do not touch attendance or streaks here — that is 6-2.
    Paraglide keys in en/de/bo.

- id: "6-4"
  title: Class schedules & extra sessions
  description: >-
    Each class has a schedule — weekdays (usually Sunday), one start time
    and duration, a start date and an optional end date — set by the admin
    or any teacher of the class, also when the admin creates a class. A
    class gets a session only on the admin's class days that match its
    schedule; the admin or a class teacher can add an extra session for
    the class on any other class day. Changing a schedule regenerates
    sessions from today on and keeps past ones. See SPEC.md CAP-9, CAP-10
    and calendar.md. Build before 6-2.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Replaces 0018's create_sessions_for_class_day() /
    create_sessions_for_class() "every class on every class day" with
    schedule matching; reuse classes.default_start_time /
    default_duration_minutes as the schedule time rather than a parallel
    table unless justified. 0018 is live on hosted: the migration must
    keep every existing session — existing classes get weekdays = the
    weekdays of the class days they have sessions on, start date = their
    earliest session, no end date — prove it with a test. Regeneration
    touches only sessions dated today (Berlin) or later; a still-matching
    future session keeps its override and cancellation. Extras only on an
    existing class day (CAP-9). Keep is_admin()/is_teacher_of_class()
    RLS and security-definer writes. UI: /calendar "Class defaults" →
    "Class schedules"; schedule fields on the admin class create form;
    "Add extra session" for admin and the class's teachers. Paraglide
    en/de/bo. Resolves the deferred-work entry "A class created mid-year
    gets sessions on every past class day".

- id: "6-2"
  title: Attendance per session & calendar holidays
  description: >-
    Teachers mark attendance against a scheduled session instead of a
    free-chosen date, and streak holidays come from the calendar (a week
    with no non-cancelled session). See SPEC.md CAP-2, CAP-4 constraints
    and calendar.md. Build after 6-4.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    attendance_records.session_date (0003) and the week bucketing plus
    zero-rows-means-holiday rule in recompute_student_streak() (0007)
    are what changes. Existing attendance history must be backfilled
    onto sessions without losing or moving any mark, and every current
    student's streak must be identical before and after the migration —
    prove it with a test. Keep attendance_records append-only.

# Feature 7: Parent Role (CAP-12, CAP-13; amends CAP-1, CAP-2, CAP-4, CAP-7, CAP-8, CAP-11)
# Story 6-3 (student-set Coming / On leave) retired 2026-09-26: CAP-11 is now
# parent-only; its scope moved to 7-4.
- id: "7-1"
  title: Parent accounts, admin approval & My Profile
  description: >-
    A parent self-registers with email and password, confirms the email,
    and only the admin approves or rejects them; a teacher or admin can
    also hold the parent role on the same login and switch roles in-app.
    Parents get a My Profile page like the teacher's. See SPEC.md CAP-12,
    CAP-7 and roles-and-permissions.md.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Implement ARCHITECTURE-SPINE AD-4: parent capability lives only in an
    approved `parents` row (PK = auth user id; pending/approved/rejected;
    approvable only after email confirmation), never inferred from
    profiles.role. Add is_parent() and one getCapabilities() helper for
    route guards; the role switcher is presentation only and RLS unions
    everything a login holds. A parent-only login is created by a server
    action; a signed-in teacher/admin requests parent capability by an
    RLS-guarded insert of their own pending row; the admin creating a
    teacher whose email already has a parent-only login promotes it.
    Rejection deletes the parents row (and the auth user for a
    parent-only login) so the email can re-register. Teachers never see
    parent registrations. Keep the #50 fix (0020): client metadata may
    carry at most `parent`. My Profile reuses the teacher's page (display
    name, password, forgot-password; email read-only). Paraglide en/de/bo.

- id: "7-2"
  title: Parent-first student registration & linking
  description: >-
    A student can register only with the email of an approved parent,
    which links them to that parent; siblings share the email and the
    parent sees pending children as waiting for approval. The separate
    guardian-email confirmation is dropped. See SPEC.md CAP-1, CAP-12 and
    roles-and-permissions.md. Build after 7-1.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    AD-10: the link is a stored FK profiles.parent_id -> parents.id ON
    DELETE RESTRICT, set once at sign-up; RLS never matches email text;
    parent_id, guardian_email and role are writable only by trusted paths
    (guard trigger, including through the teacher's registration-review
    update). AD-11: the student's auth user gets a synthetic email (the
    existing student email domain) via the Admin API, pre-confirmed with
    a random unshared password; the parent match happens inside the
    auth-user insert trigger and raises to roll back the sign-up. The
    server pre-check only returns found/not-found for the exact FR-3
    message "No parent account found. Check the email is correct, or ask
    your parent to register first." Retire the 0006 guardian-email
    confirmation; student approval no longer needs email_confirmed_at.
    Consent step stays. Add linked_children() (pending + approved, name
    and status only). No real families yet: test data is reset at
    release, so no data migration.

- id: "7-3"
  title: Parent child overview & details (read-only)
  description: >-
    An approved parent lands on per-child summary cards (classes, open
    and overdue homework counts) and opens a child to see homework,
    attendance, skill status with history, teacher notes, streak, badges,
    team and leaderboard, sessions and leave answers, and teachers —
    changing nothing. See SPEC.md CAP-13, CAP-2. Build after 7-2.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    AD-12: add `or is_parent_of(student_id)` to the SELECT policies of
    the student-keyed tables and is_parent_in_class(class_id) on the
    class-keyed ones; no parent INSERT/UPDATE/DELETE anywhere. The parent
    variant of class_people returns teachers only; the leaderboard shows
    team totals only. Functions that treat auth.uid() as the student take
    an explicit student id and check self-or-parent. Open/Overdue counts
    come from one homework_counts(student_id) shared by the student page,
    parent card and admin view. attendance_records.notes stay
    teacher-only (AD-12 assumption). Teacher-side notes field label:
    "Visible to the student's parent". Prove with RLS tests that a parent
    cannot read another child or write anything. Paraglide en/de/bo.

- id: "7-4"
  title: "Parent session leave: Coming / On leave, planned vs short-notice"
  description: >-
    The parent marks a linked child Coming or On leave per session until
    it starts; On leave set at least the admin-configurable Leave Notice
    Period (default 2 weeks) ahead is planned and protects the streak,
    later is short-notice and costs a grace week. The student sees the
    answer read-only. See SPEC.md CAP-11, CAP-4, calendar.md and
    gamification.md. Replaces 6-3; build after 7-3.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    AD-13/AD-15: append-only session_leave_history keyed by
    class_session_id + student_id (coming/on_leave/sick); only
    is_parent_of(student_id) may insert; the database enforces the
    cutoffs from AD-15's single session-start source. A BEFORE INSERT
    trigger stamps planned/short_notice via classify_leave(); the client
    never supplies it, and the parent's "Planned or Short-Notice" preview
    must call the same logic. Classification is frozen at insert. Leave
    Notice Period is a stored admin setting, not a constant. AD-14:
    classmates and teammates read leave only through one security-definer
    function that returns sick as on_leave. Remove any student-side leave
    control. Wire streak grace into recompute_student_streak() (0021);
    Sick is stored here but its approval is 7-5.

- id: "7-5"
  title: Sick leave with teacher approval
  description: >-
    The parent can mark a child Sick for a session until the end of the
    day after it; any teacher of the class (admin as backup) approves or
    rejects, undecided Sick is auto-approved after 2 weeks, and the
    child's streak is recalculated for that week on decision. See SPEC.md
    CAP-11, CAP-4 and gamification.md. Build after 7-4.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    AD-13: decisions live in sick_leave_decisions keyed by
    (class_session_id, student_id), not by a leave row; a rejection is
    final for that session. AD-4: no one who is_parent_of the student can
    decide (policy WITH CHECK). A daily pg_cron catch-up job approves
    undecided Sick whose session started >= 14 days ago, recorded with a
    system actor. Pending Sick does not protect the streak; approved does
    regardless of notice; rejected costs one grace week. Collect no
    reason or medical detail. Teachers need a pending-Sick queue on their
    side. Paraglide en/de/bo.

- id: "7-6"
  title: Guardian email correction & parent deletion request
  description: >-
    A student can request a guardian email change that the admin
    approves, moving them to the new (approved) parent; a parent can
    submit a deletion request for a linked child into the existing admin
    queue, and their account remains after the child is deleted. See
    SPEC.md CAP-1, CAP-8. Build after 7-3.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    AD-10: guardian_email_change_requests; its approval trigger applies
    the new guardian_email and parent_id together, and the new email must
    belong to an approved parent; parent_id never changes any other way.
    AD-9: reuse the one deletion_requests queue with requested_by = the
    parent (checked by is_parent_of); the cascade stays on admin approval
    and the row is de-identified, not deleted. AD-4: the admin cannot be
    blocked, but no approval comes from the child's own parent. Parent
    rows survive child deletion (ON DELETE RESTRICT is on the child side).
